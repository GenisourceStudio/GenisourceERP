server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Resolve the API container at request time through Docker's embedded DNS.
    # A static `upstream { server app:8080; }` makes Nginx refuse to start when the API
    # container is down — one restart would take the whole console offline. Resolving
    # lazily keeps the SPA served and returns 502 for API calls instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $erp_app http://app:8080;
        proxy_pass $erp_app$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        set $erp_app http://app:8080;
        proxy_pass $erp_app$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v3/api-docs {
        set $erp_app http://app:8080;
        proxy_pass $erp_app$uri$is_args$args;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        set $erp_app http://app:8080;
        proxy_pass $erp_app$uri$is_args$args;
        proxy_set_header Host $host;
    }

    # Hashed assets can be cached aggressively.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths render the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
